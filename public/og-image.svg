<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background: Ink -->
  <rect width="1200" height="630" fill="#0E0E0E"/>

  <!-- Saffron accent bar (top) -->
  <rect x="0" y="0" width="1200" height="8" fill="#F2A900"/>

  <!-- Wordmark -->
  <text
    x="100"
    y="280"
    font-family="'Bricolage Grotesque', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="110"
    font-weight="800"
    fill="#F4EFE6"
    letter-spacing="-3"
  >MOSALA<tspan fill="#F2A900">.</tspan></text>

  <!-- Tagline -->
  <text
    x="100"
    y="360"
    font-family="'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="34"
    font-weight="600"
    fill="#F4EFE6"
  >Marques &amp; Créateurs · Des accords clairs par écrit.</text>

  <!-- Subtitle -->
  <text
    x="100"
    y="415"
    font-family="'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="22"
    fill="#A49F96"
  >Une équipe humaine pour vérifier chaque profil et cadrer chaque collaboration.</text>

  <!-- Waitlist Badge -->
  <rect x="100" y="475" width="260" height="52" rx="26" fill="#F2A900"/>
  <text
    x="230"
    y="508"
    font-family="'Hanken Grotesk', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
    font-size="18"
    font-weight="700"
    fill="#0E0E0E"
    text-anchor="middle"
  >Liste d'attente ouverte</text>

  <!-- Decorative geometric detail -->
  <circle cx="1060" cy="315" r="160" fill="none" stroke="#F2A900" stroke-width="1.5" opacity="0.25"/>
  <circle cx="1060" cy="315" r="90" fill="none" stroke="#F4EFE6" stroke-width="1" opacity="0.15"/>
</svg>
